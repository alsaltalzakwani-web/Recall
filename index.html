<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recall — Spaced Review Scheduler</title>
<meta name="description" content="Recall: a spaced-repetition review scheduler for students. Subjects, lessons, and a customizable spaced-review schedule, saved on your device.">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="site-header">
  <div class="site-header-inner">
    <div class="brand-group">
      <div class="brand-logo"><img src="assets/etqan-logo.jpg" alt="إتقان"></div>
      <div class="brand-tagline" id="brand-tagline"></div>
    </div>
    <div class="header-controls">
      <div class="schedule-settings-block" id="schedule-settings-block">
        <button type="button" id="schedule-settings-btn" class="schedule-settings-btn" title="جدول المراجعة">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>
        <div id="schedule-settings-slot"></div>
      </div>
      <div class="numerals-toggle" id="numerals-toggle">
        <button type="button" data-numerals="western">123</button>
        <button type="button" data-numerals="eastern">١٢٣</button>
      </div>
    </div>
  </div>
</header>
<main id="app"></main>
<footer class="site-footer">
  <span id="site-footer-note"></span>
</footer>

<script src="js/i18n.js"></script>
<script src="js/storage.js"></script>
<script src="js/app.js"></script>
</body>
</html>
